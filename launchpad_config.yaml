      icon: "CalendarRange"
      color: "#0F766E"
      bg_color: "#CCFBF1"
      suggestions:
        - "How many internships should I apply to each day?"
        - "How do I stand out in an interview?"
        - "Where can I find entry-level jobs that build real skills?"
    - title: "Search & Apply"
      icon: "Search"
      color: "#2563EB"
      bg_color: "#EFF6FF"
      suggestions:
        - "Build a Handshake and LinkedIn search plan for business analytics internships."
        - "What companies should a Leeds undergrad target this semester?"
        - "How do I track applications without getting overwhelmed?"
    - title: "Resume & Materials"
      icon: "FilePenLine"
      color: "#D97706"
      bg_color: "#FFFBEB"
      suggestions:
        - "Rewrite my resume bullets for an internship in marketing analytics."
        - "What keywords should I add for ATS screening?"
        - "Review my experience section for a junior-year candidate."
    - title: "Interview & Network"
      icon: "MessagesSquare"
      color: "#4F46E5"
      bg_color: "#EEF2FF"
      suggestions:
        - "Give me 10 behavioral interview questions for a finance internship."
        - "How should I research a company the night before?"
        - "Draft a LinkedIn outreach message to an alumni in my field."

personas:
  base_prompt: |
    **Formatting (Compact Markdown v1):**
    - Use GitHub-Flavored Markdown.
    - Output exactly three sections in this order:
      - `### Thought` — one sentence that reflects on the user's situation from YOUR perspective.
      - `### What to do` — exactly 3 bullets, one line each, with practical actions.
      - `### Next step` — one imperative sentence telling the user what to do now.
    - Use `###` for headings and `-` for bullets.
    - Insert one blank line between sections.
    - Keep each section unique and non-repetitive.
    - Be encouraging but honest about competitive markets; never invent job openings or fake company contacts.
    - Prefer Handshake, LinkedIn, university career services, and official company career pages as primary channels.
    - When discussing employer expectations, prefer NACE-backed themes: problem solving, teamwork, communication, initiative, work ethic, technical skills, adaptability, and analytical skills — and tell students to show evidence, not buzzwords.
    - When discussing networking, coach alumni-tool outreach and informational interviews; never invent contacts or guaranteed referrals.
    - Point students to docs/career_knowledge/ and Canvas Career Resources when they want citeable links.
    - When a USER CAREER PROFILE is provided, personalize advice to academic standing, career focus, target roles, constraints, and work style.
    - Treat career_focus as the primary trajectory switch:
      - "Internship search" → prioritize internships, Handshake/career fairs, junior-friendly roles, return-offer paths.
      - "Full-time / entry-level" → prioritize new-grad / entry-level FT search, stronger interview rigor, offer comparison.
    - Never invent job openings, alumni contacts, metrics, or experience the user did not claim.
  personas_dir: "personas/career_advisors"

orchestrator:
  min_words_without_keywords: 6
  conversation_history_token_threshold: 4000
  specific_keywords:
    - "internship"
    - "intern"
    - "job"
    - "career"
    - "resume"
    - "cv"
    - "cover letter"
    - "handshake"
    - "linkedin"
    - "interview"
    - "behavioral"
    - "recruiter"
    - "ats"
    - "apply"
    - "application"
    - "networking"
    - "alumni"
    - "offer"
    - "full-time"
    - "entry-level"
    - "sophomore"
    - "junior"
    - "senior"
    - "leeds"
    - "undergrad"
    - "deadline"
    - "portfolio"
  clarification_questions:
    - "What is your academic standing (sophomore, junior, senior) and target start term?"
    - "Which majors, industries, or role types are you targeting?"
    - "Are you optimizing for internships, full-time entry-level, or both?"
    - "How many hours per week can you realistically spend on applications?"
  clarification_suggestions:
    - "Ask for a weekly Handshake and LinkedIn search plan"
    - "Upload your resume for ATS-focused edits"
    - "Request behavioral interview practice for your target role"
    - "Get a daily application cadence with tracking tips"

auth:
  algorithm: "HS256"
  token_expiry_minutes: 43200

mongodb:
  database_name: "launchpad_advisor"

llm:
  provider: "openai"
  gemini:
    model: "gemini-2.5-flash"
  ollama:
    model: "llama3.2:1b"
  vllm:
    api_url: ""
    api_key: ""
    api_username: "guest"
    model_id: ""
    neon_persona_orchestrator: "vanilla"
    neon_persona_advisors: "vanilla"
  openai:
    # Key comes from the OPENAI_API_KEY env var / HF Space secret (never committed).
    api_key: ""
    model: "gpt-5.4-mini"
    orchestrator_reasoning_effort: "low"
    persona_reasoning_effort: "none"
  resilient:
    race_timeout_seconds: 60

rag:
  embedding_model: "all-MiniLM-L6-v2"
  chroma_collection: "launchpad_documents"

tools:
  current_datetime:
    enabled: true
    default_timezone: "America/Denver"
  nutrition_calculator:
    enabled: false

voice:
  stt_endpoint: "https://whisper.neonaiservices.com"
  tts_endpoint: "https://coqui.neonaiservices.com"
